<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЧАУУ! — Итальянское Приключение</title>
    <meta name="description" content="Визуальная новелла про Еву и Полину, которые вместо Алабуги попали в Италию!">
    <meta name="theme-color" content="#0d0014">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FF3C78;
            --gold: #FFD600;
            --teal: #00E5C4;
            --purple: #7B2FBE;
            --dark: #0d0014;
            --card: rgba(18, 6, 30, 0.92);
            --border: rgba(255, 60, 120, 0.5);
            --text: #f0e6ff;
            --font-display: 'Unbounded', sans-serif;
            --font-body: 'Nunito', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        html, body {
            width: 100%; height: 100%;
            background: var(--dark);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
        }

        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s, transform 0.4s; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }

        /* SCREAMER */
        #screamer {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: #000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.05s;
        }
        #screamer.active { opacity: 1; pointer-events: all; }
        #screamer-text {
            font-family: var(--font-display); font-size: clamp(4rem,12vw,9rem);
            color: red; text-shadow: 0 0 40px red, 0 0 80px red;
            animation: scream 0.08s infinite;
        }
        @keyframes scream { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.08) rotate(3deg)} }

        /* BG CANVAS */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* ══ TITLE ══ */
        #screen-title {
            z-index: 10;
            background: radial-gradient(ellipse at 50% 70%, #1a0033 0%, var(--dark) 70%);
        }
        .title-glow { text-align: center; padding: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        .title-main {
            font-family: var(--font-display); font-size: clamp(2.8rem, 11vw, 6.5rem); font-weight: 900;
            background: linear-gradient(135deg, var(--pink), var(--gold), var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1.1; letter-spacing: -2px;
        }
        .title-sub { font-size: clamp(0.8rem, 3vw, 1.1rem); color: rgba(255,255,255,0.55); margin-top: 8px; letter-spacing: 4px; text-transform: uppercase; }
        .title-desc { max-width: 500px; margin: 16px auto; font-size: clamp(0.85rem, 2.5vw, 1rem); color: rgba(255,255,255,0.72); line-height: 1.6; text-align: center; padding: 0 20px; }
        .btn-start {
            margin-top: 24px; padding: 16px 48px;
            background: linear-gradient(135deg, var(--pink), var(--purple));
            border: none; border-radius: 50px; cursor: pointer;
            font-family: var(--font-display); font-size: clamp(0.9rem, 3vw, 1.2rem); font-weight: 700;
            color: white; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 0 40px rgba(255,60,120,0.6), 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-start:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 60px rgba(255,60,120,0.8); }
        .title-chars { display:flex; gap:16px; justify-content:center; margin-top:20px; flex-wrap:wrap; padding:0 16px; }
        .title-char-avatar { width:50px; height:50px; border-radius:50%; border:2px solid var(--pink); object-fit:cover; transition:transform 0.2s; }
        .title-char-avatar:hover { transform:scale(1.15); }

        /* ══ SELECT ══ */
        #screen-select {
            z-index: 10;
            background: radial-gradient(ellipse at 30% 50%, #0a0022 0%, var(--dark) 60%);
            overflow-y: auto; padding: 16px; align-items: flex-start; justify-content: flex-start;
        }
        .select-title { text-align: center; width: 100%; font-family: var(--font-display); font-size: clamp(1.1rem, 4vw, 1.8rem); color: var(--gold); margin-bottom: 4px; padding-top: 8px; }
        .select-subtitle { text-align:center; width:100%; color:rgba(255,255,255,0.45); font-size:0.85rem; margin-bottom:16px; }
        .chars-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:12px; width:100%; max-width:720px; margin:0 auto; }
        .char-card {
            background: var(--card); border: 2px solid rgba(255,60,120,0.25);
            border-radius: 16px; padding: 14px 10px; text-align: center;
            cursor: pointer; transition: all 0.25s; position: relative; overflow: hidden;
        }
        .char-card:hover { border-color: var(--pink); transform: translateY(-5px); box-shadow: 0 10px 35px rgba(255,60,120,0.3); }
        .char-card.selected { border-color: var(--gold); box-shadow: 0 0 28px rgba(255,214,0,0.4); }
        .char-avatar { width:74px; height:74px; border-radius:50%; object-fit:cover; border:3px solid var(--pink); margin-bottom:8px; }
        .char-name { font-family:var(--font-display); font-size:0.75rem; color:var(--gold); margin-bottom:5px; font-weight:700; }
        .char-desc { font-size:0.72rem; color:rgba(255,255,255,0.62); line-height:1.4; }
        .char-badge { position:absolute; top:7px; right:7px; font-size:1.1rem; }
        .char-tag { display:inline-block; background:rgba(255,60,120,0.15); border:1px solid var(--pink); border-radius:20px; font-size:0.62rem; padding:2px 7px; margin-top:5px; color:var(--pink); }
        .btn-play-char {
            display:block; margin:18px auto 10px; padding:13px 38px;
            background:linear-gradient(135deg,var(--gold),#ff9500);
            border:none; border-radius:50px; cursor:pointer;
            font-family:var(--font-display); font-size:0.95rem; font-weight:700; color:var(--dark);
            box-shadow:0 0 28px rgba(255,214,0,0.4); transition:all 0.2s;
        }
        .btn-play-char:hover { transform:translateY(-3px); box-shadow:0 0 48px rgba(255,214,0,0.6); }
        .btn-play-char:disabled { opacity:0.4; pointer-events:none; }

        /* ══ GAME ══ */
        #screen-game { z-index: 10; padding: 0; background: var(--dark); flex-direction: column; justify-content: flex-start; overflow: hidden; }

        .game-bg {
            position: relative; width: 100%; flex: 0 0 auto;
            height: clamp(180px, 38vw, 340px);
            background-size: cover; background-position: center;
            transition: background-image 0.5s; overflow: hidden;
        }
        .game-bg::after {
            content:''; position:absolute; inset:0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.08) 0%, rgba(13,0,20,0.92) 100%);
        }

        .game-hud { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 12px; pointer-events: none; }
        .hud-pill { background: rgba(13,0,20,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,60,120,0.35); border-radius: 20px; padding: 4px 10px; font-family: var(--font-display); font-size: 0.58rem; color: var(--pink); text-transform: uppercase; letter-spacing: 1px; pointer-events: all; }
        .hud-right { display:flex; gap:6px; flex-direction:column; align-items:flex-end; }
        .hud-score { color: var(--gold); }

        .scene-chars { position: absolute; bottom: 0; right: 0; z-index: 8; display: flex; gap: 6px; padding: 6px; }
        .scene-char-bubble { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .scene-char-img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--pink); }
        .scene-char-name { font-size: 0.52rem; color: white; text-align: center; font-family: var(--font-display); }

        .game-dialogue { flex: 1; overflow-y: auto; padding: 12px 12px 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
        .chapter-title { font-family: var(--font-display); font-size: 0.68rem; color: var(--pink); text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .chapter-title::after { content:''; flex:1; height:1px; background:rgba(255,60,120,0.25); }
        .story-box { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; font-size: clamp(0.82rem, 2.4vw, 0.97rem); line-height: 1.7; color: var(--text); backdrop-filter: blur(4px); }
        .story-box.highlight { border-color: var(--gold); background: rgba(255,214,0,0.07); }
        .speaker-label { font-family: var(--font-display); font-size: 0.62rem; color: var(--teal); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .game-choices { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 7px; }
        .choice-question { font-family: var(--font-display); font-size: 0.72rem; color: var(--gold); text-align: center; margin-bottom: 3px; }
        .choices-row { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; }
        .choice-btn {
            flex: 1; min-width: 90px; max-width: 200px;
            background: rgba(255,60,120,0.1); border: 1.5px solid rgba(255,60,120,0.3);
            border-radius: 11px; padding: 9px 12px; cursor: pointer;
            font-family: var(--font-body); font-size: clamp(0.78rem, 2.4vw, 0.92rem); font-weight: 700;
            color: var(--text); transition: all 0.18s; text-align: center; -webkit-appearance: none;
        }
        .choice-btn:hover, .choice-btn:active { background:rgba(255,60,120,0.28); border-color:var(--pink); transform:translateY(-2px); }
        .choice-btn.correct { background:rgba(0,229,196,0.18); border-color:var(--teal); color:var(--teal); }
        .choice-btn.wrong { background:rgba(255,60,120,0.2); border-color:var(--pink); animation:shake 0.3s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
        .choice-btn.disabled { opacity:0.45; pointer-events:none; }

        .minigame-box { background: var(--card); border: 1.5px dashed rgba(255,214,0,0.4); border-radius: 14px; padding: 12px; text-align: center; }
        .minigame-title { font-family:var(--font-display); color:var(--gold); font-size:0.75rem; margin-bottom:8px; }
        .big-tap-btn { font-size: 2.4rem; background: none; border: none; cursor: pointer; animation: pulse 1s infinite; display: inline-block; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
        .tap-counter { font-family:var(--font-display); font-size:1.9rem; color:var(--gold); margin:6px 0; }
        .tap-progress { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-top:6px; }
        .tap-progress-bar { height:100%; background:linear-gradient(90deg,var(--pink),var(--gold)); border-radius:3px; transition:width 0.15s; }

        .game-nav { display: flex; gap: 9px; padding: 9px 12px 12px; border-top: 1px solid rgba(255,60,120,0.12); }
        .nav-btn { flex: 1; padding: 11px; border: none; border-radius: 11px; cursor: pointer; font-family: var(--font-display); font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; transition: all 0.18s; }
        .nav-btn-prev { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.45); }
        .nav-btn-prev:hover { background:rgba(255,255,255,0.13); color:white; }
        .nav-btn-next { background:linear-gradient(135deg,var(--pink),var(--purple)); color:white; box-shadow:0 4px 18px rgba(255,60,120,0.4); }
        .nav-btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(255,60,120,0.6); }
        .nav-btn:disabled { opacity:0.3; pointer-events:none; }

        .game-topbar { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px; border-bottom: 1px solid rgba(255,60,120,0.12); background: var(--dark); flex-shrink: 0; }
        .topbar-left { display:flex; gap:8px; align-items:center; }
        .topbar-hero { display:flex; align-items:center; gap:7px; }
        .topbar-hero-img { width:30px; height:30px; border-radius:50%; border:2px solid var(--pink); object-fit:cover; }
        .topbar-hero-name { font-family:var(--font-display); font-size:0.62rem; color:var(--pink); }
        .topbar-right { display:flex; gap:6px; align-items:center; }
        .topbar-btn { background:none; border:none; cursor:pointer; font-size:1.1rem; padding:4px; opacity:0.68; transition:opacity 0.18s; }
        .topbar-btn:hover { opacity:1; }
        .progress-bar { height: 3px; background: rgba(255,60,120,0.18); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); transition: width 0.45s; }

        /* ══ END ══ */
        #screen-end { z-index: 10; background: radial-gradient(ellipse at 50% 50%, #1a0033 0%, var(--dark) 70%); text-align: center; padding: 20px; overflow-y: auto; }
        .end-emoji { font-size: 3.5rem; margin-bottom: 8px; display: block; }
        .end-title { font-family:var(--font-display); font-size:clamp(1.4rem,5vw,2.3rem); color:var(--gold); margin-bottom:8px; }
        .end-desc { color:rgba(255,255,255,0.68); line-height:1.6; margin-bottom:16px; max-width:480px; font-size:0.92rem; }
        .end-personality { background:var(--card); border:2px solid var(--gold); border-radius:16px; padding:18px; margin:14px auto; max-width:380px; }
        .end-personality-img { width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); margin-bottom:8px; }
        .end-personality-name { font-family:var(--font-display); font-size:0.95rem; color:var(--gold); margin-bottom:5px; }
        .achievements-list { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:10px 0; }
        .ach-chip { background: rgba(255,214,0,0.1); border: 1px solid rgba(255,214,0,0.4); border-radius: 20px; padding: 3px 10px; font-size:0.72rem; color:var(--gold); }
        .end-btns { display:flex; flex-direction:column; gap:9px; max-width:280px; margin:0 auto; }
        .btn-other-char { padding:11px; background:linear-gradient(135deg,var(--teal),#0090ff); border:none; border-radius:11px; color:var(--dark); font-family:var(--font-display); font-size:0.82rem; font-weight:700; cursor:pointer; transition:all 0.2s; }
        .btn-other-char:hover { transform:translateY(-2px); }
        .btn-restart { padding:11px; background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.18); border-radius:11px; color:white; font-family:var(--font-display); font-size:0.82rem; cursor:pointer; }

        /* ══ ACH PANEL ══ */
        #ach-panel { position: fixed; top: 0; right: -330px; width: 310px; height: 100%; background: var(--card); border-left: 1px solid var(--border); z-index: 100; padding: 18px; overflow-y: auto; transition: right 0.3s; backdrop-filter: blur(12px); }
        #ach-panel.open { right: 0; }
        .ach-panel-title { font-family:var(--font-display); color:var(--gold); font-size:0.95rem; margin-bottom:14px; }
        .ach-item { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,60,120,0.1); }
        .ach-icon { font-size:1.4rem; flex-shrink:0; }
        .ach-name { font-family:var(--font-display); font-size:0.68rem; color:var(--gold); }
        .ach-desc { font-size:0.72rem; color:rgba(255,255,255,0.48); margin-top:2px; }
        .ach-locked .ach-icon, .ach-locked .ach-name, .ach-locked .ach-desc { opacity:0.28; filter:grayscale(1); }
        .ach-close { position:absolute; top:14px; right:14px; background:none; border:none; color:white; font-size:1.4rem; cursor:pointer; }

        /* ── TOAST ── */
        #ach-toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--card); border: 2px solid var(--gold); border-radius: 14px; padding: 10px 18px; display: flex; gap: 10px; align-items: center; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s; z-index: 200; opacity: 0; min-width: 240px; max-width: 88vw; }
        #ach-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-icon { font-size: 1.7rem; }
        .toast-text { font-family:var(--font-display); font-size:0.68rem; color:var(--gold); }
        .toast-name { font-size:0.82rem; }

        /* ── LYRICS ── */
        #lyrics-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: rgba(13,0,20,0.82); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,214,0,0.25); padding: 5px 12px; text-align: center; transition: opacity 0.5s; }
        #lyrics-text { font-family:var(--font-display); font-size:clamp(0.58rem,1.8vw,0.75rem); color:var(--gold); }

        /* ── MUSIC FAB ── */
        #music-fab { position: fixed; bottom: 38px; right: 12px; z-index: 60; width: 42px; height: 42px; border-radius: 50%; background: rgba(13,0,20,0.78); border: 1.5px solid rgba(255,60,120,0.35); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s; }
        #music-fab:hover { border-color:var(--pink); }

        /* ── FLASH ── */
        #flash { position:fixed; inset:0; z-index:5000; background:white; opacity:0; pointer-events:none; }

        /* ── BURST ── */
        .ciao-burst { position: fixed; pointer-events: none; z-index: 500; font-family: var(--font-display); font-size: 1.8rem; color: var(--gold); text-shadow: 0 0 18px var(--gold); animation: burst 0.75s forwards; }
        @keyframes burst { 0%{opacity:1;transform:scale(0.5) translateY(0)} 100%{opacity:0;transform:scale(1.4) translateY(-55px)} }

        @media (min-width: 600px) {
            #screen-game { max-width: 540px; left: 50%; transform: translateX(-50%); }
            #screen-game.hidden { transform: translateX(-50%) scale(0.96); }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,60,120,0.28); border-radius: 2px; }
    </style>
</head>
<body>

<div id="flash"></div>
<div id="screamer"><div id="screamer-text">😱</div></div>
<canvas id="bg-canvas"></canvas>

<div id="ach-toast">
    <div class="toast-icon" id="toast-icon">🏆</div>
    <div class="toast-text">
        <div>Достижение разблокировано!</div>
        <div class="toast-name" id="toast-name"></div>
    </div>
</div>

<div id="ach-panel">
    <button class="ach-close" id="ach-close">✕</button>
    <div class="ach-panel-title">🏆 Достижения</div>
    <div id="ach-list"></div>
</div>

<div id="music-fab" title="Музыка">🎵</div>
<div id="lyrics-bar" style="display:none;"><div id="lyrics-text"></div></div>
<audio id="bg-music" loop><source src="assets/audio/song.mp3" type="audio/mpeg"></audio>

<!-- TITLE -->
<div class="screen" id="screen-title">
    <div class="title-glow">
        <div class="title-main">ЧАУУ!</div>
        <div class="title-sub">Итальянское Приключение</div>
        <div class="title-desc">Ева и Полина летели в Алабугу Политех, но попали в Италию! Одна история — пять взглядов. Выбери своего героя!</div>
        <div class="title-chars" id="title-chars-preview"></div>
        <button class="btn-start" id="btn-to-select">▶ НАЧАТЬ ИГРУ</button>
    </div>
</div>

<!-- SELECT -->
<div class="screen hidden" id="screen-select">
    <div class="select-title">👤 Выбери персонажа</div>
    <div class="select-subtitle">Одна история — с разных сторон</div>
    <div class="chars-grid" id="chars-grid"></div>
    <button class="btn-play-char" id="btn-play-char" disabled>Играть за выбранного ▶</button>
</div>

<!-- GAME -->
<div class="screen hidden" id="screen-game">
    <div class="game-topbar">
        <div class="topbar-left">
            <div class="topbar-hero">
                <img src="" id="topbar-hero-img" class="topbar-hero-img" alt="">
                <span id="topbar-hero-name" class="topbar-hero-name"></span>
            </div>
        </div>
        <div class="topbar-right">
            <button class="topbar-btn" id="btn-ach" title="Достижения">🏆</button>
            <button class="topbar-btn" id="btn-menu" title="Меню">☰</button>
        </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="game-bg" id="game-bg">
        <div class="game-hud">
            <div class="hud-pill" id="hud-chapter">Глава 1</div>
            <div class="hud-right"><div class="hud-pill hud-score" id="hud-score">⭐ 0</div></div>
        </div>
        <div class="scene-chars" id="scene-chars"></div>
    </div>
    <div class="game-dialogue" id="game-dialogue"></div>
    <div class="game-choices" id="game-choices"></div>
    <div class="game-nav">
        <button class="nav-btn nav-btn-prev" id="btn-prev" disabled>◀ НАЗАД</button>
        <button class="nav-btn nav-btn-next" id="btn-next">ДАЛЕЕ ▶</button>
    </div>
</div>

<!-- END -->
<div class="screen hidden" id="screen-end">

// ── CANVAS ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
const particles = Array.from({length:55}, () => ({
    x: Math.random()*window.innerWidth, y: Math.random()*window.innerHeight,
    r: Math.random()*1.5+0.3, dx:(Math.random()-0.5)*0.25, dy:-Math.random()*0.18-0.08, alpha:Math.random()
}));
function animateP() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,214,0,${p.alpha*0.45})`; ctx.fill();
        p.x+=p.dx; p.y+=p.dy;
        if(p.y<0){p.y=canvas.height;p.x=Math.random()*canvas.width;}
    });
    requestAnimationFrame(animateP);
}
animateP();

// ── HELPERS ──
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
    document.getElementById('screen-'+id).classList.remove('hidden');
}

function flash() {
    const f=document.getElementById('flash');
    f.style.transition=''; f.style.opacity='1';
    setTimeout(()=>{f.style.transition='opacity 0.4s';f.style.opacity='0';},60);
}

function triggerScreamer() {
    const s=document.getElementById('screamer');
    const msgs=['😱','👁️','⚠️','💀'];
    document.getElementById('screamer-text').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    s.classList.add('active');
    try{
        const ac=new AudioContext(), osc=ac.createOscillator(), g=ac.createGain();
        osc.connect(g); g.connect(ac.destination);
        osc.frequency.setValueAtTime(60,ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(280,ac.currentTime+0.25);
        g.gain.setValueAtTime(0.25,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.9);
        osc.start(); osc.stop(ac.currentTime+0.9);
    }catch(e){}
    setTimeout(()=>s.classList.remove('active'),1400);
}

function burstCiao(x,y) {
    const el=document.createElement('div');
    el.className='ciao-burst'; el.style.left=x+'px'; el.style.top=y+'px';
    const bursts=['🤌 ЧАУ!','⭐','✨','🎉'];
    el.textContent=bursts[Math.floor(Math.random()*bursts.length)];
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),800);
}

// ── ACHIEVEMENTS ──
function unlockAchievement(id) {
    if(state.achievements.includes(id)) return;
    state.achievements.push(id);
    try{localStorage.setItem('ciao_achievements',JSON.stringify(state.achievements));}catch(e){}
    const a=ACHIEVEMENTS.find(x=>x.id===id);
    if(!a) return;
    const t=document.getElementById('ach-toast');
    document.getElementById('toast-icon').textContent=a.icon;
    document.getElementById('toast-name').textContent=a.name;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3200);
    renderAchPanel();
}

function renderAchPanel() {
    document.getElementById('ach-list').innerHTML=ACHIEVEMENTS.map(a=>{
        const u=state.achievements.includes(a.id);
        return `<div class="ach-item ${u?'':'ach-locked'}">
            <div class="ach-icon">${a.icon}</div>
            <div><div class="ach-name">${u?a.name:'???'}</div><div class="ach-desc">${u?a.desc:'Ещё не разблокировано'}</div></div>
        </div>`;
    }).join('');
}

let selectedHero=null;

// ── GAME ──
function startGame(heroId) {
    state.hero=heroId; state.sceneIdx=0; state.score=0;
    state.tapCount=0; state.tapDone=false; state.choiceDone=false;
    const h=HEROES.find(x=>x.id===heroId);
    document.getElementById('topbar-hero-img').src=h.img;
    document.getElementById('topbar-hero-name').textContent=h.name;
    showScreen('game');
    renderScene();
}

function renderScene() {
    const scenes=SCENES[state.hero];
    const scene=scenes[state.sceneIdx];
    if(!scene) return;
    state.tapCount=0; state.tapDone=false; state.choiceDone=false;

    document.getElementById('game-bg').style.backgroundImage=`url('${scene.bg}')`;
    document.getElementById('hud-chapter').textContent=scene.chapter||'';
    document.getElementById('hud-score').textContent='⭐ '+state.score;
    document.getElementById('prog-fill').style.width=((state.sceneIdx/(scenes.length-1))*100)+'%';

    const charsEl=document.getElementById('scene-chars');
    charsEl.innerHTML=(scene.chars||[]).map(cid=>{
        const h=HEROES.find(x=>x.id===cid);
        if(!h) return '';
        return `<div class="scene-char-bubble"><img src="${h.img}" class="scene-char-img" onerror="this.style.display='none'"><div class="scene-char-name">${h.name}</div></div>`;
    }).join('');

    const dial=document.getElementById('game-dialogue');
    dial.innerHTML=`
        <div class="chapter-title">${scene.chapter||''}</div>
        <div class="story-box${scene.type==='story'?'':' highlight'}">
            ${scene.speaker?`<div class="speaker-label">💬 ${scene.speaker}</div>`:''}
            <div>${(scene.text||'').replace(/\n/g,'<br>')}</div>
        </div>`;

    const choicesEl=document.getElementById('game-choices');
    choicesEl.innerHTML='';

    if(scene.type==='choice') {
        choicesEl.innerHTML=`
            <div class="choice-question">${scene.question||''}</div>
            <div class="choices-row" id="choices-row">
                ${(scene.options||[]).map((opt,i)=>`<button class="choice-btn" data-idx="${i}">${opt}</button>`).join('')}
            </div>
            <div id="choice-feedback" style="text-align:center;color:#888;font-size:0.82rem;margin-top:6px;min-height:20px;"></div>`;
        document.querySelectorAll('.choice-btn').forEach(btn=>{
            btn.addEventListener('click',e=>{
                if(state.choiceDone) return;
                const idx=parseInt(e.currentTarget.dataset.idx);
                const ok=idx===scene.correct;
                if(ok) {
                    e.currentTarget.classList.add('correct');
                    state.score+=10; document.getElementById('hud-score').textContent='⭐ '+state.score;
                    state.choiceDone=true;
                    document.getElementById('choice-feedback').textContent=scene.correctFeedback||'✅ Правильно!';
                    document.getElementById('choice-feedback').style.color='var(--teal)';
                    document.querySelectorAll('.choice-btn').forEach(b=>b.classList.add('disabled'));
                    if(scene.achievementOnCorrect) unlockAchievement(scene.achievementOnCorrect);
                    flash();
                } else {
                    e.currentTarget.classList.add('wrong');
                    document.getElementById('choice-feedback').textContent=scene.wrongFeedback||'❌ Попробуй ещё!';
                    document.getElementById('choice-feedback').style.color='var(--pink)';
                    setTimeout(()=>e.currentTarget.classList.remove('wrong'),380);
                }
                if(scene.screamer) setTimeout(triggerScreamer,ok?200:100);
            });
        });
    } else if(scene.type==='tap') {
        state.tapTarget=scene.tapTarget||5;
        choicesEl.innerHTML=`
            <div class="minigame-box">
                <div class="minigame-title">${scene.question||'Нажми!'}</div>
                <button class="big-tap-btn" id="tap-btn">${scene.tapEmoji||'👆'}</button>
                <div class="tap-counter"><span id="tap-count">0</span>/${state.tapTarget}</div>
                <div class="tap-progress"><div class="tap-progress-bar" id="tap-bar" style="width:0%"></div></div>
                <div id="tap-feedback" style="text-align:center;color:var(--teal);font-size:0.78rem;margin-top:6px;min-height:18px;"></div>
            </div>`;
        document.getElementById('tap-btn').addEventListener('click',e=>{
            if(state.tapDone) return;
            state.tapCount++;
            document.getElementById('tap-count').textContent=state.tapCount;
            document.getElementById('tap-bar').style.width=(state.tapCount/state.tapTarget*100)+'%';
            burstCiao(e.clientX||window.innerWidth/2, e.clientY||window.innerHeight/2);
            if(state.tapCount>=state.tapTarget) {
                state.tapDone=true; state.score+=15;
                document.getElementById('hud-score').textContent='⭐ '+state.score;
                document.getElementById('tap-feedback').textContent=scene.completeFeedback||'✅ Готово!';
                document.getElementById('tap-btn').style.animation='none';
                if(scene.achievementOnComplete) unlockAchievement(scene.achievementOnComplete);
                flash();
            }
        });
    }

    document.getElementById('btn-prev').disabled=state.sceneIdx===0;
    document.getElementById('btn-next').textContent=scene.isLast?'ФИНАЛ 🎉':'ДАЛЕЕ ▶';
    setTimeout(()=>{dial.scrollTop=0;},40);
}

function nextScene() {
    const scenes=SCENES[state.hero];
    const scene=scenes[state.sceneIdx];
    if(scene.type==='choice' && !state.choiceDone) {
        const fb=document.getElementById('choice-feedback');
        if(fb){fb.textContent='👆 Сначала выбери ответ!';fb.style.color='var(--gold)';}
        return;
    }
    if(scene.type==='tap' && !state.tapDone) {
        const fb=document.getElementById('tap-feedback');
        if(fb){fb.textContent='👆 Нажми нужное количество раз!';fb.style.color='var(--gold)';}
        return;
    }
    if(scene.isLast){endGame();return;}
    state.sceneIdx++;
    renderScene();
}

function prevScene() {
    if(state.sceneIdx>0){state.sceneIdx--;renderScene();}
}

// ── END ──
function endGame() {
    if(!state.completedHeroes.includes(state.hero)){
        state.completedHeroes.push(state.hero);
        try{localStorage.setItem('ciao_completed',JSON.stringify(state.completedHeroes));}catch(e){}
    }
    if(state.completedHeroes.length>=HEROES.length) unlockAchievement('all_heroes');
    const h=HEROES.find(x=>x.id===state.hero);
    document.getElementById('end-emoji').textContent=h.emoji;
    document.getElementById('end-title').textContent='Конец! За '+h.name;
    document.getElementById('end-desc').textContent=`Ты прошёл(а) игру за ${h.name}! Очков: ${state.score}. Одна история — но сколько разных взглядов! Попробуй за другого персонажа.`;
    document.getElementById('end-personality').innerHTML=`
        <img src="${h.finalImg}" class="end-personality-img" onerror="this.style.display='none'">
        <div class="end-personality-name">${h.emoji} ${h.name}</div>
        <div style="color:rgba(255,255,255,0.55);font-size:0.82rem;">${h.tag}</div>
        <div style="margin-top:7px;color:var(--teal);font-size:0.75rem;">Пройдено ${state.completedHeroes.length}/${HEROES.length} линий</div>`;
    document.getElementById('end-achievements').innerHTML=state.achievements.map(id=>{
        const a=ACHIEVEMENTS.find(x=>x.id===id);
        return a?`<div class="ach-chip">${a.icon} ${a.name}</div>`:'';
    }).join('');
    const remaining=HEROES.filter(h=>!state.completedHeroes.includes(h.id));
    const btn=document.getElementById('btn-try-other');
    if(remaining.length>0){btn.textContent=`🔄 Пройти за ${remaining[0].emoji} ${remaining[0].name}`;btn.disabled=false;}
    else{btn.textContent='👑 Все персонажи пройдены!';btn.disabled=true;}
    showScreen('end');
}

const musicFab=document.getElementById('music-fab');
const LYRICS=[
    'Ева и Полина летели в Алабугу Политех...',
    'Но случайно попали в Италию 🇮🇹',
    'Они решили пойти на Олимпиаду...',
    'Но фигурное катание уже прошло!',
    'Ева предложила пойти смотреть волейбол 🏐',
    'Полина: "Какой волейбол на ЗИМНЕЙ Олимпиаде?!"',
    'В Дуолинго их не научили ничему кроме...',
    'ЧАУ! 🤌',
    'И всем говорили только это!',
    'Наши проигрывают...',
    'Ева начала орать матом по-русски 😱',
    'Девочки, вы знаете русский? 🇷🇺',
    'Это Илья Малинин и Пётр Гуменников! ⚡',
    'Про ЕГЭ, Бамблби и показательные!',
    'ЧАУ-ШАУ! 🤌🤌🤌',
];
let lyricIdx=0;
function rotateLyrics(){
    const el=document.getElementById('lyrics-text');
    if(el) el.textContent=LYRICS[lyricIdx%LYRICS.length];
    lyricIdx++;
}

function toggleMusic(){
    if(state.musicOn){
        audio.pause(); state.musicOn=false; musicFab.textContent='🔇';
        document.getElementById('lyrics-bar').style.display='none';
        clearInterval(state.lyricsInterval);
    } else {
        audio.play().then(()=>{
            state.musicOn=true; musicFab.textContent='🎵';
            document.getElementById('lyrics-bar').style.display='block';
            rotateLyrics();
            state.lyricsInterval=setInterval(rotateLyrics,4500);
        }).catch(()=>{});
    }
}
musicFab.addEventListener('click',toggleMusic);

// ── EVENTS ──
document.getElementById('btn-to-select').addEventListener('click',()=>{
    showScreen('select'); initCharSelect();
    if(!state.musicOn) toggleMusic();
});
document.getElementById('btn-play-char').addEventListener('click',()=>{
    if(selectedHero) startGame(selectedHero);
});
document.getElementById('btn-next').addEventListener('click',nextScene);
document.getElementById('btn-prev').addEventListener('click',prevScene);
document.getElementById('btn-try-other').addEventListener('click',()=>{showScreen('select');initCharSelect();});
document.getElementById('btn-restart-same').addEventListener('click',()=>{startGame(state.hero);});
document.getElementById('btn-ach').addEventListener('click',()=>{renderAchPanel();document.getElementById('ach-panel').classList.toggle('open');});
document.getElementById('ach-close').addEventListener('click',()=>document.getElementById('ach-panel').classList.remove('open'));
document.getElementById('btn-menu').addEventListener('click',()=>{
    if(confirm('Вернуться к выбору персонажа?')){showScreen('select');initCharSelect();}
});
document.getElementById('screamer').addEventListener('click',()=>document.getElementById('screamer').classList.remove('active'));

// ── INIT ──
renderAchPanel();
showScreen('title');
</script>
</body>
</html>
